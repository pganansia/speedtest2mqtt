name: Release

# Publie une nouvelle version lors de la publication d'une release GitHub
# (tag au format vX.Y.Z) : image multi-architecture sur Docker Hub et
# GitHub Container Registry, avec les tags X.Y.Z, X.Y et latest, puis
# signature des images.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (X.Y.Z), sans le « v »'
        required: true

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: pganansia/speedtest2mqtt
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  scan:
    name: Scan before release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Build amd64 image for scan
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: speedtest2mqtt:scan
          cache-from: type=gha
      - name: Grype vulnerability scan
        id: scan
        uses: anchore/scan-action@v7.4.0
        with:
          image: speedtest2mqtt:scan
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: sarif
      - name: Upload vulnerability report
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  publish:
    name: Build, push and sign
    runs-on: ubuntu-latest
    needs: scan
    permissions:
      contents: read
      packages: write # publication sur ghcr.io
      id-token: write # signature sans clé avec cosign
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.1
      - name: Log into Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags : 1.4.0, 1.4 et latest, sur les deux registres.
      # Labels OCI (version, date, révision) ajoutés automatiquement.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: |
            latest=true
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Signature de chaque image par son empreinte (digest), sur chaque registre
      - name: Sign images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for image in "${DOCKERHUB_IMAGE}" "${GHCR_IMAGE}"; do
            cosign sign --yes "${image}@${DIGEST}"
          done
